<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      header,
      footer {
        height: 100px;
        background-color: rgb(192, 228, 160);
      }
      section {
        height: 500px;
        background-color: rgb(109, 225, 225);
        display: flex;
        justify-content: center;
        align-items: center;
      }
      main {
        display: flex;
        justify-content: center;
        padding: 20px 0;
      }
      main > .inner {
        width: 960px;
        background-color: rgb(228, 200, 255);
        display: flex;
        justify-content: space-between;
      }
      .inner > div {
        width: 307px;
        height: 400px;
        background-color: #fff;
        border: 1px solid #000;
      }
    </style>
  </head>
  <body>
    <div id="wrapper">
      <header></header>
      <section><h2>메인비주얼영역</h2></section>
      <main>
        <div class="inner">
          <div></div>
          <div></div>
          <div></div>
        </div>
      </main>
      <footer></footer>
    </div>
  </body>
</html>
