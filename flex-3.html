<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       .wrap{
        width: 600px;height:40px;
        background-color:#666;
        margin-top: 50px;
       }

       .wrap>div:nth-child(1){background-color: red;}
       .wrap>div:nth-child(2){background-color: green;}
       .wrap>div:nth-child(3){background-color: blue;}
       .wrap1>div{width: 100px;}
       .wrap2>div{width: 300px;}
       .wrap3>div{width: 400px;}
       .wrap4{width: 800px;}
       .wrap4>div{width: 300px;}
       .wrap5>div{flex-basis: 0;}
    </style>
</head>
<body>
    <!-- div.wrap$*4>div.box*3 -->
    <div class="wrap1 wrap">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
    <div class="wrap2 wrap">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
    <div class="wrap3 wrap">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
    <div class="wrap4 wrap">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
    <div class="wrap5 wrap">
        <div class="box">박스</div>
        <div class="box">박스 박스</div>
        <div class="box">박스</div>
    </div>
</body>
</html>
