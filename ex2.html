<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      legend {
        display: none;
      }
    </style>
  </head>
  <body>
    <form action="/ex" method="post">
      <fieldset>
        <legend>개인정보</legend>
        <div>
          <label for="userId">아이디:</label
          ><input
            type="text"
            id="userId"
            name="userId"
            maxlength="12"
            required
            placeholder="영문 소문자 4-12자"
          />
        </div>
        <div>
          <label for="pw">비밀번호</label>
          <input
            type="password"
            id="pw"
            name="pw"
            placeholder="8자 이상"
            minlength="8"
            required
          />
        </div>
        <div>
          <label for="email">이메일</label>
          <input
            type="email"
            id="email"
            name="email"
            laceholder="you@example.com"
            required
          />
        </div>
        <div>
          <label
            ><input type="radio" name="gender" value="m" id="m" />남성</label
          >
          <label
            ><input type="radio" name="gender" value="f" id="f" />여성</label
          >
        </div>
        <div>
          <label><input type="checkbox" name="interest" value="ai" />ai</label>
          <label
            ><input type="checkbox" name="interest" value="data" />data</label
          >
          <label
            ><input type="checkbox" name="interest" value="web" />web</label
          >
          <label
            ><input
              type="checkbox"
              name="interest"
              value="design"
            />design</label
          >
        </div>
        <div>
          <select name="path" id="path">
            <option value="">선택하세요</option>
            <optgroup label="온라인">
              <option value="search">검색</option>
              <option value="sns">SNS 광고</option>
              <option value="blog">블로그 후기</option>
            </optgroup>
            <optgroup label="오프라인">
              <option value="friend">지인 소개</option>
              <option value="event">행사·부스</option>
            </optgroup>
          </select>
        </div>
        <div>
          <textarea></textarea>
        </div>
      </fieldset>
      <input type="hidden" name="signup_from" value="web" />
      <div>
        <button type="reset">초기화</button>
        <button type="submit">가입하시</button>
        <!-- <input type="submit" value="가입하기" />
        <input type="reset" value="취소하기" /> -->
      </div>
    </form>
  </body>
</html>
