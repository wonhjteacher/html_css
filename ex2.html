<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      legend {
        display: none;
      }
    </style>
  </head>
  <body>
    <form action="/ex" method="post">
      <fieldset>
        <legend>개인정보</legend>
        <div>
          <label for="userId">아이디:</label
          ><input
            type="text"
            id="userId"
            name="userId"
            maxlength="12"
            required
            placeholder="영문 소문자 4-12자"
          />
        </div>
        <div>
          <label for="pw">비밀번호</label>
          <input
            type="password"
            id="pw"
            name="pw"
            placeholder="8자 이상"
            minlength="8"
            required
          />
        </div>
        <div>
          <label for="email">이메일</label>
          <input
            type="email"
            id="email"
            name="email"
            laceholder="you@example.com"
            required
          />
        </div>
        <div>
          <label
            ><input type="radio" name="gender" value="m" id="m" />남성</label
          >
          <label
            ><input type="radio" name="gender" value="f" id="f" />여성</label
          >
        </div>
      </fieldset>
    </form>
  </body>
</html>
