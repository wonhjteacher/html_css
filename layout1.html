<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      #wrapper {
        width: 960px;
        margin: 50px auto;
      }
      header,
      footer {
        height: 100px;
        background-color: #6dbb72;
      }
      main {
        height: 500px;
        padding: 20px 0;
        background-color: #999;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-content: space-between;
      }
      main > div {
        width: 470px;
        height: 220px;
      }
      main > div:nth-child(1) {
        background-color: rgb(107, 53, 215);
      }
      main > div:nth-child(2) {
        background-color: rgb(216, 236, 103);
      }
      main > div:nth-child(3) {
        background-color: rgb(243, 127, 65);
      }
      main > div:nth-child(4) {
        background-color: rgb(77, 208, 248);
      }
    </style>
  </head>
  <body>
    <div id="wrapper">
      <header></header>
      <main>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
      </main>
      <footer></footer>
    </div>
  </body>
</html>
